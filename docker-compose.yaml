networks:
  dev:

services:
  nginx:
    networks:
      - dev
    depends_on:
      - backend
    image: nginx:stable-alpine
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    restart: always
  backend:
    networks:
      - dev
    depends_on:
      database:
        condition: service_healthy
    build:
      context: ./
    env_file:
      - env/django.env
      - env/postgres.env
    restart: always
  database:
    networks:
      - dev
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - "postgres_storage:/var/lib/postgresql/data"
    env_file:
      - env/postgres.env
    restart: always

volumes:
  postgres_storage:
