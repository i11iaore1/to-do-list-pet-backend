user root;
worker_processes 1;

events {
}

http {
    default_type  application/octet-stream;
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name partrick.todolist.backend.com;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
